name: Garmin 2FA Aktivierung

on:
  workflow_dispatch:
    inputs:
      mfa_code:
        description: 'Schritt 2: Hier den E-Mail-Code eintragen'
        required: false
        default: ''

jobs:
  auth:
    runs-on: ubuntu-latest
    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0'

      - name: Install RGS Tool
        run: dotnet tool install --global RenphoGarminSync-CLI

      - name: Starte Autorisierung oder Sende Code
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          MFA_CODE: ${{ github.event.inputs.mfa_code }}
        run: |
          if [ -empty "$MFA_CODE" ]; then
            echo "Fordere 2FA Code von Garmin an..."
            rgs auth garmin --u "$GARMIN_EMAIL" --pw "$GARMIN_PASSWORD" || true
          else
            echo "Sende 2FA Code an Garmin..."
            rgs auth garmin --u "$GARMIN_EMAIL" --mfa "$MFA_CODE"
          fi
